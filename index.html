  producto(id) {
    var ps = this.state.productos;
    for (var i = 0; i < ps.length; i++) { if (ps[i].i === id) return ps[i]; }
    return null;
  }

  ordenados(lista) {
    return lista.slice().sort(function (a, b) {
      var ia = PRIMERO.indexOf(a.i), ib = PRIMERO.indexOf(b.i);
      return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
    });
  }

  subtotal() { return this.state.cart.reduce(function (a, c) { return a + c.price * c.qty; }, 0); }

  envioElegido(sub) {
    var e = this.state.envio;
    if (e === 'recogida') return 'recogida';
    if (sub < GRATIS_DESDE) return 'fijo';
    return e || 'gratis';
  }

  anadir() {
    var p = this.producto(this.state.pid);
    if (!p) return;
    var s = this.state;
    var personal = !p.s;
    var key = [p.i, personal ? s.nombre.trim() : '', personal ? s.tecnica : '', p.t ? s.talla.trim() : '', personal ? s.notas.trim() : '', personal ? s.detalles.trim() : ''].join('|');
    var cart = s.cart.slice();
    var found = false;
    for (var i = 0; i < cart.length; i++) {
      if (cart[i].key === key) { cart[i] = Object.assign({}, cart[i], { qty: cart[i].qty + s.qty }); found = true; }
    }
    if (!found) {
      cart.push({ key: key, id: p.i, name: p.n, price: p.p, img: p.f[0], qty: s.qty,
        nombre: personal ? s.nombre.trim() : '', tecnica: personal ? s.tecnica : '',
        talla: p.t ? s.talla.trim() : '', notas: personal ? s.notas.trim() : '', detalles: personal ? s.detalles.trim() : '' });
    }
    this.setState({ cart: cart, cartOpen: true, aviso: 'Añadido: ' + p.n });
  }

  cambiarQty(key, delta) {
    var cart = [];
    this.state.cart.forEach(function (c) {
      if (c.key !== key) { cart.push(c); return; }
      var q = c.qty + delta;
      if (q > 0) cart.push(Object.assign({}, c, { qty: q }));
    });
    this.setState({ cart: cart, aviso: '' });
  }

  quitar(key) {
    this.setState({ cart: this.state.cart.filter(function (c) { return c.key !== key; }), aviso: '' });
  }

  confirmar() {
    var co = this.state.co;
    var sub0 = this.subtotal();
    var recogida = this.envioElegido(sub0) === 'recogida';
    var obligatorios = recogida ? ['nombre', 'apellidos', 'tel', 'email'] : ['nombre', 'apellidos', 'dir', 'cp', 'ciudad', 'provincia', 'email'];
    var faltan = obligatorios.filter(function (k) { return !String(co[k]).trim(); });
    if (faltan.length) { this.setState({ coError: recogida ? 'Rellena nombre, apellidos, teléfono y correo para poder quedar contigo.' : 'Rellena los campos obligatorios (*) para continuar.' }); return; }
    if (co.email.indexOf('@') < 1) { this.setState({ coError: 'Revisa el correo electrónico.' }); return; }
    if (!co.terminos) { this.setState({ coError: 'Tienes que aceptar los términos y condiciones.' }); return; }
    if (!this.state.cart.length) { this.setState({ coError: 'Tu carrito está vacío.' }); return; }
    var sub = this.subtotal();
    var env = this.envioElegido(sub) === 'fijo' ? ENVIO : 0;
    var num = String(1000 + Math.floor(Math.random() * 9000));
    this.go('gracias', { pedido: { num: num, total: sub + env, email: co.email.trim(), pago: this.state.pago, recogida: recogida }, cart: [], coError: '', hist: [] });
  }

  enviarContacto() {
    var ct = this.state.ct;
    if (!ct.nombre.trim() || !ct.email.trim()) { this.setState({ ctError: 'Dime tu nombre y cómo contactarte.' }); return; }
    if (!ct.acepto) { this.setState({ ctError: 'Tienes que aceptar la política de privacidad.' }); return; }
    this.setState({ ctEnviado: true, ctError: '' });
  }

  renderVals() {
    var self = this;
    var s = this.state;
    var ps = s.productos;
    var avisoKey = this.props.aviso ?? 'Navidad';

    var goCat = {};
    Object.keys(ATAJO).forEach(function (k) {
      goCat[k] = function () { self.go('tienda', { cat: ATAJO[k] }); };
    });
    var goProd = {};
    Object.keys(DESTACADOS).forEach(function (k) {
      goProd[k] = function () { self.verProducto(DESTACADOS[k]); };
    });

    var v = { inicio: s.view === 'inicio', tienda: s.view === 'tienda', producto: s.view === 'producto', noelia: s.view === 'noelia', bodas: s.view === 'bodas', contacto: s.view === 'contacto', checkout: s.view === 'checkout', gracias: s.view === 'gracias' };
    var nav = {
      inicio: v.inicio ? NAV_ON : NAV_OFF, tienda: v.tienda || v.producto ? NAV_ON : NAV_OFF,
      bodas: v.bodas ? NAV_ON : NAV_OFF, noelia: v.noelia ? NAV_ON : NAV_OFF, contacto: v.contacto ? NAV_ON : NAV_OFF
    };

    var prev = s.hist.length ? s.hist[s.hist.length - 1] : null;
    var backLabel = 'Volver al inicio';
    if (prev) {
      if (prev.view === 'tienda') backLabel = 'Volver a ' + (prev.cat === 'todas' ? 'la tienda' : LABEL[prev.cat]);
      else if (prev.view === 'producto') { var pp = this.producto(prev.pid); backLabel = 'Volver a ' + (pp ? pp.n : 'el producto'); }
      else backLabel = 'Volver a ' + (NOMBRE_VISTA[prev.view] || 'la página anterior');
    }
    var back = { visible: !v.inicio && !v.gracias, label: backLabel, go: function () { self.atras(); } };

    var counts = { todas: ps.length };
    ps.forEach(function (p) { counts[p.c] = (counts[p.c] || 0) + 1; });
    var cats = [['todas', 'Todas']].concat(CATS).map(function (c) {
      return { label: c[1], count: counts[c[0]] || 0, style: s.cat === c[0] ? CHIP_ON : CHIP_OFF,
        pick: function () { self.go('tienda', { cat: c[0] }); } };
    });

    var tarjeta = function (p) { return { img: p.f[0], name: p.n, price: eur(p.p), go: function () { self.verProducto(p.i); } }; };
    var grupos = CATS.filter(function (c) { return s.cat === 'todas' || s.cat === c[0]; }).map(function (c) {
      var items = self.ordenados(ps.filter(function (p) { return p.c === c[0]; }));
      return { label: c[1], countTxt: items.length + (items.length === 1 ? ' producto' : ' productos'), showHead: s.cat === 'todas',
        ver: function () { self.go('tienda', { cat: c[0] }); }, items: items.map(tarjeta) };
    }).filter(function (g) { return g.items.length > 0; });
    var nShop = s.cat === 'todas' ? ps.length : (counts[s.cat] || 0);
    var shop = {
      title: s.cat === 'todas' ? 'Todos los productos' : LABEL[s.cat],
      kicker: KICKER[s.cat] || '',
      countTxt: s.cargando ? '' : nShop + (nShop === 1 ? ' producto' : ' productos'),
      loading: s.cargando, groups: grupos
    };

    var p = v.producto ? this.producto(s.pid) : null;
    var prod = { name: '', cat: '', tag: '', price: '', desc: '', img: '', thumbs: [], hasThumbs: false, tecnicas: [], personal: false, talla: false, rel: [], hasRel: false, lineTxt: '', wa: WA, plazo: '', garantia: '', goCat: function () {} };
    if (p) {
      var foto = Math.min(s.foto, p.f.length - 1);
      prod = {
        name: p.n, cat: LABEL[p.c] || 'Tienda', tag: (LABEL[p.c] || '') + (p.s ? ' · En stock' : ' · Personalizable'),
        price: eur(p.p), desc: OVERRIDE[p.i] || DESC[p.c] || DESC.bolsosyneceseres,
        img: p.f[foto], hasThumbs: p.f.length > 1,
        thumbs: p.f.map(function (u, i) {
          return { img: u, label: 'Ver foto ' + (i + 1), style: THUMB + (i === foto ? 'box-shadow: 0 0 0 3px #E44E56' : 'box-shadow: 0 0 0 1px #FAD8DB'),
            pick: function () { self.setState({ foto: i }); } };
        }),
        personal: !p.s, talla: p.t,
        detallesLabel: p.i === 'cestas-personalizadas' ? '¿Qué productos te gustaría añadir a tu cesta?' : 'Cuéntame cualquier detalle importante',
        detallesPh: p.i === 'cestas-personalizadas' ? 'Ej. babero, muselina, chupetero…' : 'Ej. para cuándo lo necesitas, colores, si es un regalo…',
        tecnicas: TECNICAS.map(function (t) {
          return { label: t, checked: s.tecnica === t ? 'true' : 'false', style: s.tecnica === t ? CHIP_ON : CHIP_OFF, pick: function () { self.setState({ tecnica: t }); } };
        }),
        lineTxt: eur(p.p * s.qty),
        wa: WA + '?text=' + encodeURIComponent('Hola Noelia, me interesa: ' + p.n),
        plazo: p.s ? 'En stock: sale en 24-48 h laborables.' : 'Se cose por encargo: listo en unos 10 días, más 24-72 h de envío.',
        garantia: p.s ? 'Si no es lo que esperabas, tienes 14 días para devolverlo.' : 'Te confirmo el diseño antes de coser. Al llevar nombre, no admite devolución salvo defecto.',
        goCat: function () { self.go('tienda', { cat: p.c }); },
        rel: self.ordenados(ps.filter(function (x) { return x.i !== p.i && x.c === p.c; })).slice(0, 4).map(tarjeta)
      };
      prod.hasRel = prod.rel.length > 0;
    }
    var on = {
      nombre: function (e) { self.setState({ nombre: e.target.value }); },
      talla: function (e) { self.setState({ talla: e.target.value }); },
      notas: function (e) { self.setState({ notas: e.target.value }); },
      detalles: function (e) { self.setState({ detalles: e.target.value }); }
    };

    var count = 0;
    var sub = this.subtotal();
    var items = s.cart.map(function (c) {
      count += c.qty;
      var opts = [];
      if (c.nombre) opts.push('Nombre: ' + c.nombre);
      if (c.tecnica) opts.push('Técnica: ' + c.tecnica);
      if (c.talla) opts.push('Talla: ' + c.talla);
      if (c.notas) opts.push('Tela: ' + c.notas);
      if (c.detalles) opts.push(c.detalles);
      return { img: c.img, name: c.name, qtyName: c.qty + ' × ' + c.name, opts: opts.length ? opts.join(' · ') : eur(c.price) + ' / unidad', qty: c.qty, line: eur(c.price * c.qty),
        mas: function () { self.cambiarQty(c.key, 1); }, menos: function () { self.cambiarQty(c.key, -1); },
        quitar: function () { self.quitar(c.key); }, go: function () { self.verProducto(c.id); } };
    });
    var falta = Math.max(0, GRATIS_DESDE - sub);
    var cart = { open: s.cartOpen, items: items, count: count, hasItems: count > 0, empty: count === 0, subtotal: eur(sub),
      headerTxt: count > 0 ? eur(sub) : 'Carrito', aviso: s.aviso, hasAviso: !!s.aviso && count > 0,
      envioTxt: falta > 0 ? 'Te faltan ' + eur(falta) + ' para el envío gratis' : '¡Tienes envío gratis!',
      envioPct: Math.min(100, Math.round(sub / GRATIS_DESDE * 100)) + '%' };

    var envSel = this.envioElegido(sub);
    var envios = [];
    if (sub >= GRATIS_DESDE) envios.push({ id: 'gratis', label: 'Envío gratuito', precio: '0,00 €' });
    envios.push({ id: 'fijo', label: 'Envío a domicilio', precio: eur(ENVIO) });
    envios.push({ id: 'recogida', label: 'Recogida en mano (San Clemente y pueblos cercanos)', precio: 'Gratis' });
    envios = envios.map(function (e) {
      return Object.assign(e, { checked: envSel === e.id, style: envSel === e.id ? OPT_ON : OPT_OFF, pick: function () { self.setState({ envio: e.id, coError: '' }); } });
    });
    var totalNum = sub + (envSel === 'fijo' ? ENVIO : 0);
    var total = { txt: eur(totalNum), iva: eur(totalNum - totalNum / 1.21) };
    var envioInfo = { falta: falta > 0 && count > 0 && envSel === 'fijo', txt: 'Añade ' + eur(falta) + ' más y el envío te sale gratis.' };
    var pagos = PAGOS.map(function (pg) {
      return { label: pg.label, desc: pg.desc, checked: s.pago === pg.id, style: PAGO + (s.pago === pg.id ? 'box-shadow: 0 0 0 2px #E44E56' : 'box-shadow: 0 0 0 1px #FAD8DB'),
        pick: function () { self.setState({ pago: pg.id }); } };
    });

    var coSet = function (k) { return function (e) { var co = Object.assign({}, self.state.co); co[k] = e.target.value; self.setState({ co: co, coError: '' }); }; };
    var onCo = {}; ['nombre', 'apellidos', 'dir', 'dir2', 'cp', 'ciudad', 'provincia', 'tel', 'email', 'notas'].forEach(function (k) { onCo[k] = coSet(k); });
    var co = Object.assign({}, s.co, { error: s.coError, hasError: !!s.coError,
      recogida: envSel === 'recogida', conDireccion: envSel !== 'recogida', telLabel: envSel === 'recogida' ? '*' : '(opcional)' });

    var ctSet = function (k) { return function (e) { var ct = Object.assign({}, self.state.ct); ct[k] = k === 'acepto' ? e.target.checked : e.target.value; self.setState({ ct: ct, ctError: '' }); }; };
    var onCt = {}; ['nombre', 'email', 'tema', 'mensaje', 'acepto'].forEach(function (k) { onCt[k] = ctSet(k); });
    var ct = Object.assign({}, s.ct, { enviado: s.ctEnviado, form: !s.ctEnviado, error: s.ctError, hasError: !!s.ctError,
      gracias: 'He recibido tu mensaje, ' + (s.ct.nombre.trim() || '') + '. Te respondo lo antes posible a ' + (s.ct.email.trim() || 'tu contacto') + '.' });

    var PAGO_TXT = { tarjeta: 'Pago con tarjeta realizado correctamente.', transferencia: 'Haz la transferencia indicando el nº de pedido como referencia. Te enviamos los datos de la cuenta por email.', reembolso: 'Pagarás en efectivo cuando recibas el paquete.' };
    var pedido = s.pedido ? { num: s.pedido.num,
      txt: 'Total: ' + eur(s.pedido.total) + (s.pedido.recogida ? ' (IVA incluido, recogida en mano). Te escribo por WhatsApp para quedar cuando esté listo.' : ' (IVA y envío incluidos).') + ' Te llegará la confirmación a ' + s.pedido.email + '.',
      pago: s.pedido.recogida && s.pedido.pago === 'reembolso' ? 'Pagarás en efectivo cuando quedemos para la entrega.' : PAGO_TXT[s.pedido.pago] } : { num: '', txt: '', pago: '' };

    var bodas = BODAS.map(function (b) { return { titulo: b.titulo, texto: b.texto, fotos: b.fotos.map(function (f) { return { caption: f[0], img: f[1] }; }) }; });

    return {
      aviso: { visible: avisoKey !== 'Ninguno' && !!AVISOS[avisoKey], texto: AVISOS[avisoKey] || '' },
      v: v, nav: nav, back: back, cats: cats, shop: shop, prod: prod, form: { nombre: s.nombre, talla: s.talla, notas: s.notas, detalles: s.detalles, qty: s.qty }, on: on,
      cart: cart, envios: envios, envioInfo: envioInfo, total: total, pagos: pagos, provincias: PROVINCIAS,
      co: co, onCo: onCo, ct: ct, onCt: onCt, pedido: pedido, goCat: goCat, goProd: goProd, bodas: bodas,
      onTerminos: function (e) { var c = Object.assign({}, self.state.co, { terminos: e.target.checked }); self.setState({ co: c, coError: '' }); },
      goInicio: function () { self.go('inicio'); },
      goTienda: function () { self.go('tienda', { cat: 'todas' }); },
      goBodas: function () { self.go('bodas'); },
      goNoelia: function () { self.go('noelia'); },
      goContacto: function () { self.go('contacto'); },
      goCheckout: function () { self.go('checkout'); },
      openCart: function () { self.setState({ cartOpen: true, aviso: '' }); },
      closeCart: function () { self.setState({ cartOpen: false, aviso: '' }); },
      qtyMas: function () { self.setState({ qty: Math.min(99, self.state.qty + 1) }); },
      qtyMenos: function () { self.setState({ qty: Math.max(1, self.state.qty - 1) }); },
      addToCart: function () { self.anadir(); },
      confirmarPedido: function () { self.confirmar(); },
      enviarContacto: function () { self.enviarContacto(); }
    };
  }
}

const inst = new Component({});
inst.state = Vue.reactive(inst.state);
Vue.createApp({
  template: '#tpl',
  computed: { R() { return inst.renderVals(); } },
  mounted() { inst.componentDidMount && inst.componentDidMount(); }
}).mount('#app');
</script>
</body>
</html>
